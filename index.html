<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#70462E">

  <title>SugaRRY Shop</title>

  <style>
    :root {
      --bg: #FFF9F2;
      --brown: #70462E;
      --cream: #F2E5D5;
      --white: #FFFFFF;
      --text: #392B24;
      --muted: #817268;
      --border: #E5D6C6;
      --warning: #FFF1DB;
      --danger: #A33A3A;
    }

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: Arial, "Noto Sans Thai", sans-serif;
    }

    header {
      background: var(--brown);
      color: white;
      text-align: center;
      padding: 20px 15px;
    }

    header h1 {
      margin: 0;
      font-size: 25px;
    }

    header p {
      margin: 5px 0 0;
      color: #F3E1D1;
      font-size: 13px;
    }

    nav {
      display: flex;
      gap: 7px;
      overflow-x: auto;
      padding: 10px;
      background: var(--cream);
      border-bottom: 1px solid var(--border);
    }

    button,
    select,
    input,
    textarea {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    main {
      max-width: 800px;
      margin: auto;
      padding: 15px 15px 80px;
    }

    .screen {
      display: none;
    }

    .screen.active {
      display: block;
    }

    .tab,
    .chip {
      white-space: nowrap;
      padding: 10px 13px;
      border-radius: 12px;
      background: white;
      color: var(--brown);
      border: 1px solid var(--border);
      font-weight: 700;
    }

    .tab.active,
    .chip.active {
      background: var(--brown);
      color: white;
      border-color: var(--brown);
    }

    h2 {
      color: var(--brown);
    }

    .card {
      background: white;
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 15px;
      margin: 10px 0;
    }

    .product {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .emoji {
      font-size: 36px;
    }

    .grow {
      flex: 1;
    }

    .name {
      font-weight: 800;
    }

    .muted {
      color: var(--muted);
      font-size: 13px;
      line-height: 1.5;
    }

    .price {
      font-size: 18px;
      font-weight: 800;
      color: var(--brown);
      margin-top: 5px;
    }

    .total {
      font-size: 25px;
      font-weight: 900;
      color: var(--brown);
    }

    .btn {
      width: 100%;
      padding: 13px;
      border: 0;
      border-radius: 11px;
      background: var(--brown);
      color: white;
      font-weight: 800;
      margin-top: 10px;
    }

    .btn.secondary {
      color: var(--brown);
      background: white;
      border: 1px solid var(--brown);
    }

    .wrap {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin: 10px 0;
    }

    .row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin: 12px 0;
    }

    .sectionTitle {
      margin-top: 20px;
      margin-bottom: 9px;
      font-weight: 800;
      color: var(--brown);
    }

    .input {
      width: 100%;
      padding: 12px;
      margin: 5px 0;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: #FFFDF9;
      font-size: 16px;
    }

    .counter {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .counter button {
      width: 36px;
      height: 36px;
      border: 0;
      border-radius: 9px;
      background: var(--cream);
      color: var(--brown);
      font-size: 20px;
    }

    .counter span {
      min-width: 25px;
      text-align: center;
      font-weight: 800;
    }

    .warning {
      background: var(--warning);
      color: #995824;
      padding: 12px;
      border-radius: 10px;
      font-size: 13px;
      line-height: 1.5;
    }

    .status {
      display: inline-block;
      background: var(--cream);
      padding: 5px 10px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 700;
    }

    .slip {
      width: 100%;
      max-height: 300px;
      object-fit: contain;
      border-radius: 10px;
      margin-top: 10px;
    }

    .hidden {
      display: none !important;
    }

    .center {
      text-align: center;
    }

    .empty {
      text-align: center;
      color: var(--muted);
      padding: 35px 10px;
    }

    @media (max-width: 520px) {
      .product {
        align-items: flex-start;
      }
    }
  </style>
</head>

function loadData(key,fallback){

  try{

    const data =
      localStorage.getItem(key);

    if(data){

      return JSON.parse(data);

    }

  }
  catch(error){

    console.log(error);

  }

  return fallback;

}



function saveData(){

  try{

    localStorage.setItem(
      "sugarry_cart",
      JSON.stringify(cart)
    );


    localStorage.setItem(
      "sugarry_orders",
      JSON.stringify(orders)
    );

  }
  catch(error){

    console.log(error);

    alert(
      "ไม่สามารถบันทึกข้อมูลได้"
    );

  }

  renderNav();

}



function money(value){

  return "฿" +
    Number(value || 0).toFixed(2);

}



function uid(){

  return (
    Date.now().toString(36)
    +
    Math.random()
      .toString(36)
      .slice(2,7)
  );

}



function showScreen(id){

  document
    .querySelectorAll(".screen")
    .forEach(function(screen){

      screen.classList.remove(
        "active"
      );

    });


  const target =
    document.getElementById(id);


  if(target){

    target.classList.add("active");

  }


  document
    .querySelectorAll(".tab")
    .forEach(function(tab){

      tab.classList.toggle(
        "active",
        tab.dataset.id === id
      );

    });


  if(id === "cart"){

    renderCart();

  }


  if(id === "payment"){

    renderPayment();

  }


  if(id === "orders"){

    renderOrders();

  }


  if(id === "dashboard"){

    renderDashboard();

  }


  window.scrollTo(0,0);

}



function renderNav(){

  const count =
    cart.reduce(
      function(sum,item){

        return sum + item.qty;

      },
      0
    );


  const tabs = [

    ["menu","Menu"],

    ["cart","Cart ("+count+")"],

    ["payment","Payment"],

    ["orders","Orders"],

    ["dashboard","Dashboard"]

  ];


  document.getElementById(
    "nav"
  ).innerHTML =

    tabs.map(
      function(item){

        return `

          <button
            class="tab"
            data-id="${item[0]}"
            onclick="
              showScreen('${item[0]}')
            "
          >

            ${item[1]}

          </button>

        `;

      }
    ).join("");

}



function renderMenu(){

  const categories = [

    "All",

    "Coffee",

    "Tea",

    "Smoothie",

    "Breakfast",

    "Snacks"

  ];


  document.getElementById(
    "categories"
  ).innerHTML =

    categories.map(
      function(item){

        return `

          <button
            class="chip ${
              category === item
              ? "active"
              : ""
            }"
            onclick="
              setCategory('${item}')
            "
          >

            ${item}

          </button>

        `;

      }
    ).join("");


  const products =
    MENU.filter(
      function(product){

        return (
          category === "All"
          ||
          product.cat === category
        );

      }
    );


  document.getElementById(
    "menuList"
  ).innerHTML =

    products.map(
      function(product){

        return `

          <div class="card product">

            <div class="emoji">

              ${product.icon}

            </div>


            <div class="grow">

              <div class="name">

                ${money(product.price)}

              </div>

            </div>


            <button
              class="btn"
              onclick="
                openProduct('${product.id}')
              "

              Customize +

            </button>

          </div>

        `;

      }
    ).join("");

}



function setCategory(name){

  category = name;

  renderMenu();

}



function openProduct(id){

  const product =
    MENU.find(
      function(item){

        return item.id === id;

      }
    );


  if(!product){

    return;

  }


  const defaults = {

    rice1:["grill"],

    rice2:["boil"],

    potato1:["sausage"],

    potato3:[
      "grill",
      "boil",
      "sausage",
      "bacon"
    ]

  };


  selected = {

    id:product.id,

    name:product.name,

    price:product.price,

    cat:product.cat,

    icon:product.icon,

    qty:1,

    sweet:"50%",

    ice:
      product.id === "hotlatte"
      ? "No Ice"
      : "Normal",

    roast:"Medium",

    shots:2,

    meats:
      defaults[product.id]
      ? [...defaults[product.id]]
      : [],

    extras:{},

    vegetables:{},

    dressing:"ซีซาร์",

    separate:true,

    extraDressing:0,

    note:""

  };


  renderCustomize();

  showScreen("customize");

}



function unitPrice(){

  if(!selected){

    return 0;

  }


  let total = selected.price;


  if(selected.cat === "Coffee"){

    total +=
      Math.max(
        0,
        selected.shots - 2
      ) * 20;

  }


  if(selected.cat === "Breakfast"){

    PROTEINS.forEach(
      function(item){

        total +=
          (
            selected.extras[item.id]
            || 0
          )
          * item.price;

      }
    );


    VEGETABLES.forEach(
      function(item){

        total +=
          (
            selected
              .vegetables[item.id]
            || 0
          )
          * item.price;

      }
    );


    total +=
      selected.extraDressing * 15;

  }


  return total;

}



function drinkChip(
  values,
  key
){

  return `

    <div class="wrap">

      ${

        values.map(
          function(value){

            return `

              <button
                class="chip ${
                  selected[key] === value
                  ? "active"
                  : ""
                }"
                onclick="
                  selected['${key}']
                    =
                  '${value}';

                  renderCustomize();
                "
              >

                ${value}

              </button>

            `;

          }
        ).join("")

      }

    </div>

  `;

}



function renderCustomize(){

    return;

  }


  const drink = [

    "Tea",

    "Smoothie"

  const food =

        ${selected.name}

            "Less",
            "Normal",
            "Extra",
            "Separate Ice"
          ],
          "ice"
        )}

      `;

    }

  }



  if(selected.cat === "Coffee"){

    html += `

      <div class="sectionTitle">

        ระดับการคั่ว

      </div>


      ${drinkChip(
        [
          "Medium",
          "Dark"

        "roast"
      )}

        Espresso Shots

            ${selected.shots}

            <span>

              ${item.name}

            </span>

        <div class="wrap">

          </span>


          <div class="counter">

            <button

function tlv(
  tag,
  value
){

  return (
    tag
    +
    String(value.length)
      .padStart(2,"0")
    +
    value
  );

}



function crc16(input){

  let crc = 0xFFFF;


  for(
    let i = 0;
    i < input.length;
    i++
  ){

    crc ^=
      input.charCodeAt(i)
      <<
      8;


    for(
      let j = 0;
      j < 8;
      j++
    ){

      crc =
        crc & 0x8000
        ?
        (
          (crc << 1)
          ^
          0x1021
        )
        &
        0xFFFF
        :
        (crc << 1)
        &
        0xFFFF;

    }

  }


  return crc
    .toString(16)
    .toUpperCase()
    .padStart(4,"0");

}



function promptPayQR(
  phone,
  amount
){

  const digits =
    phone.replace(
      /\D/g,
      ""
    );


  const merchant =

    tlv(
      "00",
      "A000000677010111"
    )

    +

    tlv(
      "01",
      "0066"
      +
      digits.slice(1)
    );


  const raw =

    tlv("00","01")

    +

    tlv("01","12")

    +

    tlv("29",merchant)

    +

    tlv("53","764")

    +

    tlv(
      "54",
      Number(amount)
        .toFixed(2)
    )

    +

    tlv("58","TH")

    +

    "6304";


  return (
    raw
    +
    crc16(raw)
  );

}

function pickSlip(
  id,
  input
){

  const file =
    input.files[0];


  if(!file){

    return;

  }


  if(
    file.size >
    1500000
  ){

    alert(
      "กรุณาใช้รูปขนาดไม่เกิน 1.5 MB"
    );

    return;

  }


  const reader =
    new FileReader();


  reader.onload =
    function(){

      const order =
        orders.find(
          function(item){

            return item.id === id;

          }
        );


      if(!order){

        return;

      }


      order.slip =
        reader.result;


      order.status =
        "Pending Verification";


      saveData();

      renderPayment();

    };


  reader.readAsDataURL(file);

}

    "sugarry_seller_login"
  ) === "yes";


/* สร้างหน้า Seller Login อัตโนมัติ */
function createSellerLoginPage() {

  if (
    document.getElementById(
      "sellerLogin"
    )
  ) {
    return;
  }

  const sellerSection =
    document.createElement("section");

  sellerSection.id = "sellerLogin";
  sellerSection.className = "screen";

  sellerSection.innerHTML = `

    <h2>🔐 Seller Login</h2>

    <div class="card">

      <div
        style="
          text-align:center;
          font-size:55px;
          margin-bottom:10px;
        "
      >
        ☕
      </div>

      <h2 style="text-align:center;">
        SugaRRY Seller
      </h2>

      <p
        class="muted"
        style="text-align:center;"
      >
        สำหรับเจ้าของร้านเท่านั้น
      </p>

      <div class="sectionTitle">
        Seller PIN
      </div>

      <input
        id="sellerPin"
        class="input"
        type="password"
        inputmode="numeric"
        pattern="[0-9]*"
        maxlength="6"
        autocomplete="off"
        placeholder="กรอก PIN"
        onkeydown="
          if(event.key === 'Enter'){
            sellerLogin();
          }
        "
      >

      <button
        class="btn"
        onclick="sellerLogin()"
      >
        Login → Dashboard
      </button>

      <p
        id="sellerLoginError"
        class="warning hidden"
      >
        PIN ไม่ถูกต้อง กรุณาลองอีกครั้ง
      </p>

      <button
        class="btn secondary"
        onclick="showScreen('menu')"
      >
        ← กลับหน้าร้าน
      </button>

    </div>

  `;

  const main =
    document.querySelector("main");

  const dashboard =
    document.getElementById(
      "dashboard"
    );

  if (main && dashboard) {

    main.insertBefore(
      sellerSection,
      dashboard
    );

  } else if (main) {

    main.appendChild(
      sellerSection
    );
  }
}


/* ตรวจ PIN */
function sellerLogin() {

  const pinInput =
    document.getElementById(
      "sellerPin"
    );

  const errorBox =
    document.getElementById(
      "sellerLoginError"
    );

  if (!pinInput) {
    return;
  }

  if (
    pinInput.value === SELLER_PIN
  ) {

    sellerAuthenticated = true;

    sessionStorage.setItem(
      "sugarry_seller_login",
      "yes"
    );

    pinInput.value = "";

    if (errorBox) {
      errorBox.classList.add(
        "hidden"
      );
    }

    showScreen("dashboard");

    return;
  }

  sellerAuthenticated = false;

  sessionStorage.removeItem(
    "sugarry_seller_login"
  );

  pinInput.value = "";

  if (errorBox) {
    errorBox.classList.remove(
      "hidden"
    );
  }

  pinInput.focus();
}


/* ออกจากระบบ Seller */
function sellerLogout() {

  sellerAuthenticated = false;

  sessionStorage.removeItem(
    "sugarry_seller_login"
  );

  showScreen("menu");
}


/*
  เก็บ showScreen เดิมไว้
  แล้วเพิ่มระบบตรวจ Login ก่อนเข้า Dashboard
*/
const originalShowScreen =
  window.showScreen;


window.showScreen =
  function(screenId) {

    if (
      screenId === "dashboard" &&
      !sellerAuthenticated
    ) {

      screenId = "sellerLogin";
    }

    originalShowScreen(screenId);

    if (
      screenId === "sellerLogin"
    ) {

      setTimeout(function() {

        const input =
          document.getElementById(
            "sellerPin"
          );

        if (input) {
          input.focus();
        }

      }, 100);
    }

    if (
      screenId === "dashboard" &&
      sellerAuthenticated
    ) {

      addSellerLogoutButton();
    }
  };


/* เพิ่มปุ่ม Logout ด้านบน Dashboard */
function addSellerLogoutButton() {

  const dashboardBox =
    document.getElementById(
      "dashboardBox"
    );

  if (!dashboardBox) {
    return;
  }

  if (
    document.getElementById(
      "sellerLogoutButton"
    )
  ) {
    return;
  }

  const logoutButton =
    document.createElement("button");

  logoutButton.id =
    "sellerLogoutButton";

  logoutButton.className =
    "btn secondary";

  logoutButton.textContent =
    "🔒 Logout Seller";

  logoutButton.onclick =
    sellerLogout;

  dashboardBox.insertBefore(
    logoutButton,
    dashboardBox.firstChild
  );
}


/*
  แก้ Navigation
  ไม่แสดง Dashboard ตรง ๆ
  เปลี่ยนเป็นปุ่ม Seller
*/
function renderSecureNavigation() {

  const nav =
    document.getElementById(
      "nav"
    );

  if (!nav) {
    return;
  }

  const cartCount =
    Array.isArray(window.cart)
      ? window.cart.reduce(
          function(sum, item) {
            return sum +
              Number(item.qty || 0);
          },
          0
        )
      : 0;

  nav.innerHTML = `

    <button
      class="tab"
      data-id="menu"
      onclick="showScreen('menu')"
    >
      Menu
    </button>

    <button
      class="tab"
      data-id="cart"
      onclick="showScreen('cart')"
    >
      Cart
    </button>

    <button
      class="tab"
      data-id="payment"
      onclick="showScreen('payment')"
    >
      Payment
    </button>

    <button
      class="tab"
      data-id="orders"
      onclick="showScreen('orders')"
    >
      Orders
    </button>

    <button
      class="tab"
      data-id="sellerLogin"
      onclick="
        ${
          sellerAuthenticated
            ? "showScreen('dashboard')"
            : "showScreen('sellerLogin')"
        }
      "
    >
      ${
        sellerAuthenticated
          ? "📊 Dashboard"
          : "🔐 Seller"
      }
    </button>

  `;
}


/*
  หลังหน้าเว็บโหลดเสร็จ
  สร้าง Login และเปลี่ยน Navigation
*/
createSellerLoginPage();

renderSecureNavigation();


/*
  อัปเดตเมนูเมื่อ Cart เปลี่ยน
  โดยครอบฟังก์ชัน saveData เดิม
*/
if (
  typeof window.saveData ===
  "function"
) {

  const originalSaveData =
    window.saveData;

  window.saveData =
    function() {

      originalSaveData();

      renderSecureNavigation();
    };
}


/*
  ถ้าผู้ใช้พยายามเปิด Dashboard
  จากลิงก์หรือคำสั่งอื่นโดยไม่ Login
  ให้ส่งกลับหน้า Seller Login
*/
const dashboardObserver =
  new MutationObserver(
    function() {

      const dashboard =
        document.getElementById(
          "dashboard"
        );

      if (
        dashboard &&
        dashboard.classList.contains(
          "active"
        ) &&
        !sellerAuthenticated
      ) {

        originalShowScreen(
          "sellerLogin"
        );
      }
    }
  );


dashboardObserver.observe(
  document.body,
  {
    attributes: true,
    subtree: true,
    attributeFilter: ["class"]
  }
);

</script>

</body>
</html>
